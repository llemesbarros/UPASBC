<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#006b8f">
  <title>Evolução Multidisciplinar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#111;background:#e6e9ec}*{box-sizing:border-box}
    body{margin:0}.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;padding:.65rem 1rem;background:#173847;color:#fff;box-shadow:0 2px 8px #0004}.toolbar button{border:0;border-radius:.35rem;padding:.58rem .85rem;font-weight:700;cursor:pointer}.primary{background:#23a8d3;color:#fff}.danger{background:#ffe1e1;color:#7d1010}#document-status{margin-left:auto;font-size:.86rem}.unsaved{color:#ffd76b}
    .sheet{width:210mm;min-height:297mm;margin:10mm auto;background:#fff;padding:12mm 13mm 10mm;box-shadow:0 2px 14px #0003;page-break-after:always}.sheet:last-of-type{page-break-after:auto}
    table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{border:1px solid #111}.header td{height:7mm;text-align:center}.header .logo{width:40mm;height:28mm;padding:2mm}.header img{max-width:100%;max-height:23mm;object-fit:contain}.header .city{font-size:12pt;font-weight:700;letter-spacing:.22em}.header .secretary{font-weight:700;letter-spacing:.12em}.header .unit{background:#ddd;font-size:12pt;font-weight:700;line-height:1.35;letter-spacing:.12em}
    .patient td{height:10mm;padding:1.5mm;font-size:10pt;font-weight:700;letter-spacing:.12em}.patient input{width:calc(100% - 18mm);border:0;border-bottom:1px solid #777;font:inherit;text-transform:uppercase;background:transparent}.patient .split{width:80%}.patient .small{width:20%}
    .evolution th{height:8mm;background:#d6d6d6;font-size:10pt;letter-spacing:.18em}.evolution .datetime{width:36mm}.evolution td{height:10mm;vertical-align:top}.date-time{padding:.7mm 1.2mm}.date-time input{display:block;width:100%;border:0;background:transparent;font:8.5pt Arial}.date-time input[type=time]{margin-top:.2mm}.entry{padding:1mm 1.5mm}.entry textarea{width:100%;height:7.5mm;min-height:7.5mm;border:0;resize:none;overflow:hidden;font:9.5pt Arial;line-height:1.2;background:transparent}.footer{height:6mm!important;border:0!important;text-align:center;font-size:7.5pt;padding-top:2mm!important}.page-two .evolution td{height:11.3mm}
    input:focus,textarea:focus{outline:2px solid #36a9d4;outline-offset:-2px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media(max-width:850px){.sheet{margin:0;transform-origin:top left;box-shadow:none}.toolbar{position:relative}#document-status{width:100%;margin:0}}
    @media print{@page{size:A4 portrait;margin:0}.toolbar{display:none}.sheet{margin:0;width:210mm;height:297mm;min-height:0;padding:12mm 13mm 10mm;box-shadow:none;overflow:hidden}input,textarea{outline:0!important}.date-time input[type=date]::-webkit-calendar-picker-indicator,.date-time input[type=time]::-webkit-calendar-picker-indicator{display:none}}
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Ações do documento">
    <button id="open-button">Abrir .upa24</button><button id="clear-button" class="danger">Novo</button>
    <button id="save-button" class="primary">Salvar</button><button id="save-as-button">Salvar como</button><button id="print-button">Imprimir</button>
    <span id="document-status">Novo documento</span>
  </nav>
  <main id="pages"></main>
  <input id="file-input" class="visually-hidden" type="file" accept=".upa24,application/json">
  <script src="./app.js" defer></script>
</body>
</html>
